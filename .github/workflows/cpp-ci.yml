name: C++ CI

# TEMPORARY DEBUG VERSION: instead of the test suite, this exports the model of
# VSSGenMBInfoSolver.Default7 on every platform, solves every platform's model
# on Windows and Ubuntu hardware, and compares the models by name. Revert this
# commit to restore the regular CI.

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 3
  CTEST_PARALLEL_LEVEL: 1
  REPLAY_TIME_LIMIT: 600

jobs:
  read-parameters:
    name: read-parameters
    runs-on: ubuntu-latest
    outputs:
      gurobiVersion: ${{ steps.set-output.outputs.gurobiVersion }}
      gurobiShortVersion: ${{ steps.set-output.outputs.gurobiShortVersion }}
      gurobiFolder: ${{ steps.set-output.outputs.gurobiFolder }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Read current gurobi Version
        uses: zlatko-ms/varfiletoenv@v3
        with:
          paths: ./.github/gurobi_version.json
      - name: Export variables for next jobs
        id: set-output
        run: |
          echo "gurobiVersion=${{ env.gurobiVersion }}" >> $GITHUB_OUTPUT
          echo "gurobiShortVersion=${{ env.gurobiShortVersion }}" >> $GITHUB_OUTPUT
          echo "gurobiFolder=${{ env.gurobiFolder }}" >> $GITHUB_OUTPUT
  cpp-ubuntu-latest:
    name: cpp-ubuntu-latest
    runs-on: ubuntu-latest
    needs: read-parameters
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: setup-gurobi-license
        id: write-license
        env:
          GUROBI_LICENSE: ${{ secrets.GUROBI_LICENSE   }}
        run: |
          echo "$GUROBI_LICENSE" > $PWD/gurobi.lic
          echo "GRB_LICENSE_FILE=$PWD/gurobi.lic" >> $GITHUB_ENV
      - name: download-gurobi-linux
        env:
          GUROBI_VERSION_SHORT: ${{ needs.read-parameters.outputs.gurobiShortVersion }}
          GUROBI_VERSION: ${{ needs.read-parameters.outputs.gurobiVersion }}
          GUROBI_VERSION_FOLDER: ${{ needs.read-parameters.outputs.gurobiFolder }}
          GUROBI_FILE: gurobi${{ needs.read-parameters.outputs.gurobiVersion }}_linux64.tar.gz
        run: |
          wget https://packages.gurobi.com/${{ env.GUROBI_VERSION_SHORT }}/${{ env.GUROBI_FILE }}
          tar -xzf ${{ env.GUROBI_FILE }}
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config RelWithDebInfo --target rail_test
      - name: Export Default7 model
        run: bash .github/debug/export.sh ubuntu
      - name: Solve Default7 model
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ needs.read-parameters.outputs.gurobiFolder }}/linux64/lib
        run: |
          gcl="$PWD/${{ needs.read-parameters.outputs.gurobiFolder }}/linux64/bin/gurobi_cl"
          bash .github/debug/replay.sh "$gcl" debug-model ubuntu ubuntu "$REPLAY_TIME_LIMIT"
      - uses: actions/upload-artifact@v7
        with:
          name: debug-model-ubuntu
          path: debug-model/
  cpp-macos-latest:
    name: cpp-macos-latest
    runs-on: macos-latest
    needs: read-parameters
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: setup-gurobi-license
        id: write-license
        env:
          GUROBI_LICENSE: ${{ secrets.GUROBI_LICENSE_TWO   }}
        run: |
          echo "$GUROBI_LICENSE" > $PWD/gurobi.lic
          echo "GRB_LICENSE_FILE=$PWD/gurobi.lic" >> $GITHUB_ENV
      - name: download-gurobi-mac
        env:
          GUROBI_VERSION_SHORT: ${{ needs.read-parameters.outputs.gurobiShortVersion }}
          GUROBI_VERSION: ${{ needs.read-parameters.outputs.gurobiVersion }}
          GUROBI_VERSION_FOLDER: ${{ needs.read-parameters.outputs.gurobiFolder }}
          GUROBI_FILE: gurobi${{ needs.read-parameters.outputs.gurobiVersion }}_macos_universal2.pkg
        run: |
          wget https://packages.gurobi.com/${{ env.GUROBI_VERSION_SHORT }}/${{ env.GUROBI_FILE }}
          sudo installer -pkg ${{ env.GUROBI_FILE }} -target /
      - name: Configure Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config RelWithDebInfo --target rail_test
      - name: Export Default7 model
        run: bash .github/debug/export.sh macos
      - name: Solve Default7 model
        run: |
          gcl="/Library/${{ needs.read-parameters.outputs.gurobiFolder }}/macos_universal2/bin/gurobi_cl"
          bash .github/debug/replay.sh "$gcl" debug-model macos macos "$REPLAY_TIME_LIMIT"
      - uses: actions/upload-artifact@v7
        with:
          name: debug-model-macos
          path: debug-model/
  cpp-windows-latest:
    name: cpp-windows-latest
    runs-on: windows-latest
    needs:
      - cpp-macos-latest
      - cpp-ubuntu-latest
      - read-parameters
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: setup-gurobi-license
        id: write-license
        env:
          GUROBI_LICENSE: ${{ secrets.GUROBI_LICENSE_TWO   }}
        run: |
          echo "$GUROBI_LICENSE" > $PWD/gurobi.lic
          echo "GRB_LICENSE_FILE=$PWD/gurobi.lic" >> $GITHUB_ENV
      - name: download-gurobi-windows
        shell: powershell
        env:
          GUROBI_VERSION_SHORT: ${{ needs.read-parameters.outputs.gurobiShortVersion }}
          GUROBI_VERSION: ${{ needs.read-parameters.outputs.gurobiVersion }}
          GUROBI_VERSION_FOLDER: ${{ needs.read-parameters.outputs.gurobiFolder }}
          GUROBI_FILE: Gurobi-${{ needs.read-parameters.outputs.gurobiVersion }}-win64.msi
        run: |
          wget https://packages.gurobi.com/${{ env.GUROBI_VERSION_SHORT }}/${{ env.GUROBI_FILE }} -OutFile ${{ env.GUROBI_FILE }}
          New-Item -itemType directory gurobi
          $proc = Start-Process msiexec.exe -ArgumentList "/a ${{ env.GUROBI_FILE }} /qb /L*! install.log TARGETDIR=$PWD\gurobi" -NoNewWindow -PassThru
          $timeouted = $null
          $proc | Wait-Process -Timeout 120 -ErrorAction SilentlyContinue -ErrorVariable timeouted
          if ($timeouted)
          {
            echo "TIMEOUT"
            $proc.Kill()
          }
          ls $PWD\gurobi
      - name: set-gurobi-env-variables
        id: gurobi-env-variables
        shell: powershell
        run: |
          echo "GUROBI_HOME=$PWD\gurobi\${{ needs.read-parameters.outputs.gurobiFolder }}\win64" >> $env:GITHUB_ENV
          echo "$PWD\gurobi\${{ needs.read-parameters.outputs.gurobiFolder }}\win64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config RelWithDebInfo --target rail_test
      - name: Export Default7 model
        run: bash .github/debug/export.sh windows
      - uses: actions/download-artifact@v8
        with:
          pattern: debug-model-*
          path: debug-model
          merge-multiple: true
      - name: Solve all Default7 models
        run: |
          for model in windows ubuntu macos; do
            bash .github/debug/replay.sh gurobi_cl debug-model "$model" windows "$REPLAY_TIME_LIMIT"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: debug-model-windows
          path: |
            debug-model/windows.*
            debug-model/replay-*-on-windows.log
  cross-check-ubuntu:
    name: cross-check-ubuntu
    runs-on: ubuntu-latest
    needs:
      - cpp-windows-latest
      - read-parameters
    steps:
      - uses: actions/checkout@v7
      - name: setup-gurobi-license
        env:
          GUROBI_LICENSE: ${{ secrets.GUROBI_LICENSE   }}
        run: |
          echo "$GUROBI_LICENSE" > $PWD/gurobi.lic
          echo "GRB_LICENSE_FILE=$PWD/gurobi.lic" >> $GITHUB_ENV
      - name: download-gurobi-linux
        env:
          GUROBI_VERSION_SHORT: ${{ needs.read-parameters.outputs.gurobiShortVersion }}
          GUROBI_VERSION: ${{ needs.read-parameters.outputs.gurobiVersion }}
          GUROBI_FILE: gurobi${{ needs.read-parameters.outputs.gurobiVersion }}_linux64.tar.gz
        run: |
          wget https://packages.gurobi.com/${{ env.GUROBI_VERSION_SHORT }}/${{ env.GUROBI_FILE }}
          tar -xzf ${{ env.GUROBI_FILE }}
      - uses: actions/download-artifact@v8
        with:
          pattern: debug-model-*
          path: debug-model
          merge-multiple: true
      - name: Compare models by name
        run: |
          ls -la debug-model
          for other in windows macos; do
            python3 .github/debug/compare_models.py \
              ubuntu debug-model/ubuntu.mps debug-model/ubuntu.hnt \
              "$other" "debug-model/$other.mps" "debug-model/$other.hnt" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Solve all Default7 models
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ needs.read-parameters.outputs.gurobiFolder }}/linux64/lib
        run: |
          gcl="$PWD/${{ needs.read-parameters.outputs.gurobiFolder }}/linux64/bin/gurobi_cl"
          for model in windows ubuntu macos; do
            bash .github/debug/replay.sh "$gcl" debug-model "$model" ubuntu-cross "$REPLAY_TIME_LIMIT"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: debug-replays-ubuntu-cross
          path: debug-model/replay-*-on-ubuntu-cross.log
